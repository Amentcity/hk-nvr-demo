server:
  port: 8080

spring:
  application:
    name: hk-nvr-demo

hikvision:
  # NVR 设备连接信息（通过环境变量注入）
  device:
    ip: ${HIK_DEVICE_IP:10.0.14.11}
    port: ${HIK_DEVICE_PORT:8000}
    username: ${HIK_DEVICE_USERNAME:admin}
    password: ${HIK_DEVICE_PASSWORD:hk789789}
    rtsp-port: ${HIK_RTSP_PORT:554}

  # SDK 配置
  # 支持开发机、服务器、Docker部署，不再依赖固定目录
  sdk:
#    lib-path: ${HIK_SDK_PATH:E:/project/Myself/hk-nvr-demo/src/main/resources/lib/win64}
    log-path: ${HIK_SDK_LOG_PATH:E:/project/Myself/hk-nvr-demo/logs/hksdk}
    connect-timeout-ms: ${HIK_CONNECT_TIMEOUT_MS:3000}
    reconnect-interval-ms: ${HIK_RECONNECT_INTERVAL_MS:10000}
    lib-path: E:/project/Myself/hk-nvr-demo/src/main/resources/lib/win64

  # 摄像头配置（可选，生产环境建议从 NVR 查询）
  cameras: []

  # 录像配置
  recording:
    save-dir: ${VIDEO_SAVE_DIR:E:\project\Myself\hk-nvr-demo\video}
    convert-to-mp4: ${VIDEO_CONVERT_MP4:true}

  # FFmpeg配置
  ffmpeg:
    path: ${FFMPEG_PATH:ffmpeg}

# Phase 2 实时预览配置
ffmpeg:
  path: ${FFMPEG_PATH:ffmpeg}
  max-process: ${FFMPEG_MAX_PROCESS:32}

# WebRTC媒体服务配置
media:
  server:
    host: ${MEDIA_SERVER_HOST:127.0.0.1}
    port: ${MEDIA_SERVER_PORT:80}
    app: ${MEDIA_SERVER_APP:live}
