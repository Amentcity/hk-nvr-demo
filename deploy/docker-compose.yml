version: '3.8'

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: nvr
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  nvr-service:
    image: hk-nvr-service:latest
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
